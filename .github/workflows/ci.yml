name: CI

# Documentation cannot break a build, and an iOS job bills at ten times the
# Linux rate. Five docs-only pushes in one day exhausted the account's included
# minutes for every project sharing them, so prose no longer starts a runner.
#
# The list is deliberately an ignore-list of things that are definitely not
# code, not an allow-list of things that are: a new source directory must build
# by default. Anything under androidApp/, iosApp/, sharedLogic/, gradle/ or
# .github/ always runs, including this file.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "handoffs/**"
      - "design/**"
      - "*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "handoffs/**"
      - "design/**"
      - "*.md"

# On a pull request, a newer push makes the older run irrelevant — cancel it;
# the macOS minutes are the expensive part. A push to
# main gets a group of its own (its commit), so no merge ever cancels another:
# every commit on main is verified, and main is the only ref whose runs write
# the Gradle cache. (cancel-in-progress: false would not be enough — GitHub
# keeps one pending run per group and cancels the older one when a third
# arrives.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Builds and tests only. No secrets: nothing is signed, published, or sent to
# Supabase or the API — the generated config holds placeholders.
permissions:
  contents: read

# Every `uses:` below names a commit SHA, not a tag. A tag is a moving pointer
# its owner can repoint at any time: `@v7` today and `@v7` tomorrow are a
# promise, not a guarantee, and that is exactly how tj-actions/changed-files
# shipped a credential stealer to ~23,000 repositories in March 2025 — the tags
# were retargeted, and every repository tracking them ran the new code on its
# next build. A SHA cannot be repointed. The trailing `# v7` is the human half:
# it says what the SHA was when it was pinned, so a reader knows which release
# they are on, and Dependabot rewrites both halves together — see
# .github/dependabot.yml, which exists so a pin is not a freeze.
#
# To bump one by hand:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# (dereference once more via git/tags/<sha> if it prints an annotated tag).

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint the workflows
        # First, because a workflow that is wrong is wrong before anything is
        # built, and this costs seconds. It checks .github/workflows/*.yml:
        # expression syntax, unknown keys, runner labels, and — because
        # ubuntu-latest ships shellcheck — the `run:` blocks too. It does NOT
        # read .github/actions/*/action.yml; composite actions are outside what
        # actionlint parses, so changes there are still reviewed by eye.
        #
        # The release tarball rather than a third-party action: this job is the
        # one arguing for pinned SHAs, so it should not reach for one more
        # unpinned dependency to say so. Version and digest are pinned together;
        # bump both from the release page's checksums file.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          name="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Unpacked outside the checkout, so linting the repo never sees the
          # binary that is doing the linting.
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 --output "$dir/$name" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${name}"
          echo "${ACTIONLINT_SHA256}  $dir/$name" | sha256sum --check -
          tar -xzf "$dir/$name" -C "$dir" actionlint
          "$dir/actionlint" -color

      - uses: ./.github/actions/setup-build

      - name: Check formatting
        # Before the build, not after: ktlintCheck is a few seconds against a
        # build measured in minutes, and forgetting `ktlintFormat` is the
        # common failure. Failing here reports it in about a minute instead of
        # billing the whole build first.
        #
        # `./gradlew ktlintFormat` fixes nearly everything this rejects. What it
        # cannot fix — a file named after no declaration it holds, a KDoc over
        # the wrong declaration — it names with a file:line.
        run: ./gradlew ktlintCheck

      - name: Build and test
        # On Linux, allTests runs the host (JVM) tests only — Kotlin/Native iOS
        # targets need macOS, so the iOS job runs those. ThrowsAnnotationGuardTest
        # is a host test: this job is the one that catches a missing @Throws.
        run: ./gradlew :androidApp:assembleDebug :sharedLogic:allTests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-test-reports
          path: sharedLogic/build/reports/tests/
          if-no-files-found: ignore

  ios:
    name: iOS
    # SKIE breakages surface only in the iOS build: a change Swift can see but
    # Kotlin cannot compiles on Android and fails only here.
    #
    # A pinned image rather than macos-latest: "-latest" moves to the next macOS
    # on GitHub's schedule, and a newer image may not carry the Xcode below.
    runs-on: macos-26
    # Cold runs take about 4 minutes (3m 33s and 4m 15s measured); 20 leaves ~5x
    # headroom. A hung build must not burn billed macOS minutes for GitHub's
    # 6-hour default.
    timeout-minutes: 20
    env:
      # Pinned, never inherited from the image, so an image update cannot change
      # the toolchain silently. Matches the team's Xcode; bump it deliberately.
      # This image ships the iOS 26.2 simulator runtime the tests below need.
      XCODE_VERSION: "26.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          xcodebuild -version | grep -qx "Xcode ${XCODE_VERSION}" \
            || { echo "::error::Expected Xcode ${XCODE_VERSION}"; exit 1; }

      - uses: ./.github/actions/setup-build

      - name: Read the Kotlin version
        id: kotlin
        run: |
          version=$(sed -n 's/^kotlin *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)
          if [ -z "$version" ]; then echo "::error file=gradle/libs.versions.toml::no kotlin version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Kotlin/Native toolchain
        # Keyed on the Kotlin version alone: ~/.konan holds the compiler and its
        # platform libraries, which change only when Kotlin does.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      - name: Shared tests on the iOS simulator
        # The Android job's allTests skips these on Linux; this is the only place
        # they run. They also catch what only native targets reject, such as a
        # comma in a test name.
        run: ./gradlew :sharedLogic:iosSimulatorArm64Test

      - name: Install pods
        # Writes the placeholder framework and the podspec (generated, not
        # committed), then runs pod install. The real framework comes next.
        run: ./gradlew :sharedLogic:podInstall

      - name: Build the iOS app
        # The podspec's script phase builds SharedLogic through Gradle here — this
        # is where SKIE generates the Swift API the app compiles against.
        working-directory: iosApp
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-test-reports
          path: sharedLogic/build/reports/tests/
          if-no-files-found: ignore
