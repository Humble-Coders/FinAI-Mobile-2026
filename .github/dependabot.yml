# Pinning every action to a commit SHA (see .github/workflows/ci.yml) buys
# immutability at the cost of drift: a SHA never moves, so a fix published
# upstream never arrives either. Pinning without a bump path is a trap — it
# trades a supply-chain risk for a staleness one. This is the bump path.
#
# Dependabot understands the `uses: owner/repo@<sha> # v7` form: it rewrites
# the SHA and the trailing comment together, so the pin stays readable.
#
# Scoped to actions only. Gradle and CocoaPods updates belong with a human
# deciding them against the version catalog, not with a weekly PR.
#
# The config is enough on its own for a public repository. This one is private,
# so if no Dependabot PRs appear, Dependabot is off in the org's settings —
# that switch belongs to the org owner, not to this file.
version: 2
updates:
  - package-ecosystem: github-actions
    # Two entries, because "/" alone is not the whole repository. For this
    # ecosystem it means `.github/workflows/` plus an `action.yml` at the
    # repository ROOT — and this repository's composite action is not at the
    # root, it is at .github/actions/setup-build/. Left on "/" alone, the two
    # pins inside it would never have been offered a bump, which is precisely
    # the staleness this file exists to prevent, and silently: nobody notices
    # a pull request that is not opened.
    #
    # `directories` (plural) rather than `directory`, because only the plural
    # form supports globbing.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: monthly
    # A pull request per action would be five; one grouped PR is one review.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3
