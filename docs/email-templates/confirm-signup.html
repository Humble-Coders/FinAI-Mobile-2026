<!-- Supabase → Authentication → Emails → Templates → Confirm signup.
     Subject: Your FinAI code: {{ .Token }}
     The app takes the typed code; the link is deliberately absent. -->
<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#111827">
  <p style="font-size:28px;font-weight:700;margin:0 0 24px">Fin<span style="color:#22C55E">AI</span></p>
  <p style="font-size:16px;margin:0 0 16px">Enter this code in the app to confirm your email:</p>
  <p style="font-size:32px;font-weight:700;letter-spacing:8px;margin:0 0 24px">{{ .Token }}</p>
  <p style="font-size:14px;color:#6B7280;margin:0">It expires in an hour. If you didn't create a FinAI account, ignore this email.</p>
</div>
